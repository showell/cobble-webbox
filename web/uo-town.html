<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Britain, Watched</title>
<style>
  :root { --bg: #1d2318; --ink: #efe6cf; --dim: #a99f86; --panel: #2a3123; --line: #4a523d; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.4 Georgia, serif; }
  header { display: flex; justify-content: space-between; align-items: baseline; padding: 10px 16px; gap: 12px; flex-wrap: wrap; }
  h1 { font-size: 20px; margin: 0; font-weight: normal; letter-spacing: 0.5px; }
  #clock { font-variant-numeric: tabular-nums; color: var(--dim); }
  #speed { display: flex; gap: 4px; align-items: center; color: var(--dim); font-size: 13px; }
  #speed button { font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 3px 8px; cursor: pointer; }
  #speed button.on { background: #4a5a33; border-color: #8a9a63; }
  #live { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: #7a7; margin-right: 6px; }
  #live.off { background: #c55; }
  main { display: flex; gap: 12px; padding: 0 16px 16px; flex-wrap: wrap; }
  #stage { flex: 1 1 360px; min-width: 0; max-height: calc(100vh - 70px); overflow-y: auto; border-radius: 6px; }
  canvas { display: block; touch-action: manipulation; cursor: pointer; }
  aside { flex: 0 1 300px; min-width: 0; display: flex; flex-direction: column; gap: 12px; }
  .box { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; }
  .box h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 1px; color: var(--dim); margin: 0 0 6px; font-weight: normal; }
  #crier { max-height: 340px; overflow-y: auto; margin: 0; padding: 0; list-style: none; }
  #crier li { padding: 3px 0; border-bottom: 1px dotted var(--line); }
  #crier .t { color: var(--dim); font-variant-numeric: tabular-nums; margin-right: 6px; }
  #card { min-height: 3em; }
  .hint { color: var(--dim); font-size: 13px; }
  #you form { display: flex; gap: 6px; }
  #you input { flex: 1; min-width: 0; font: inherit; background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 4px; padding: 4px 6px; }
  #you button { font: inherit; color: var(--ink); background: #4a5a33; border: 1px solid #8a9a63; border-radius: 4px; padding: 4px 10px; cursor: pointer; }
</style>
</head>
<body>
<header>
  <h1>Britain, watched</h1>
  <span id="speed">pace
    <button data-x="60">slow</button><button data-x="120">normal</button><button data-x="600">fast</button><button data-x="1200">faster</button>
  </span>
  <span id="clock"><span id="live" class="off"></span><span id="time">connecting…</span></span>
</header>
<main>
  <div id="stage"><canvas id="map"></canvas></div>
  <aside>
    <div class="box"><h2>You</h2><div id="you">
      <form id="join"><input id="name" maxlength="16" placeholder="your name (letters)" autocomplete="off"><button>Join</button></form>
    </div></div>
    <div class="box"><h2>Following</h2><div id="card" class="hint">Tap a townsperson to follow them.</div></div>
    <div class="box"><h2>The town crier</h2><ul id="crier"></ul></div>
  </aside>
</main>
<script>
// The residents of apps/uoaix's TownWatch: their jobs and activities as
// Townsfolk.md numbers them.
const JOBS = { 0: ["townsperson", "🧑"], 1: ["farmer", "🌾"], 2: ["baker", "🍞"], 3: ["smith", "⚒️"], 4: ["vendor", "🧵"] };
const DOING = ["goes to bed", "heads to work", "sits down to a meal", "goes to market", "heads for the tavern",
               "goes to worship", "visits family", "rests at home"];
const AT = ["asleep", "at work", "at a meal", "at market", "at the tavern", "at worship", "with family", "resting at home"];
const COLORS = ["#d9a441", "#8fb3d9", "#d98fb3", "#9fd98f", "#d9c38f"];
// The shopkeepers' trades, as BritainCatalog titles them.
const TRADES = { "Provisioner": "🧺", "Blacksmith": "⚒️", "Tailor": "🧵", "Baker": "🍞", "Healer": "⚕️",
  "Innkeeper": "🛏️", "Tinker": "🔧", "Carpenter": "🪚", "Paper miller": "📜", "Scribe": "✒️", "Glassblower": "🍶",
  "Potter": "🏺", "Herbalist": "🌿", "Bowyer": "🏹", "Tanner": "🦬", "Leatherworker": "👜", "Cobbler": "👞",
  "Fishmonger": "🐟", "Tavern keeper": "🍺", "Musician": "🎻", "Jeweler": "💎" };

const canvas = document.getElementById("map"), ctx = canvas.getContext("2d");
// The ground (grass, worn paths, shops), painted once offscreen and
// touched only where a path wears in; each frame copies it and draws the
// people over it.
const ground = document.createElement("canvas"), gctx = ground.getContext("2d");
let map = null, tile = 4, people = [], keepers = [], players = [], prev = {}, lastAt = 0, seconds = 0, following = null, wornSince = false;
// This browser's seat, if it joined: kept for the tab, so a reload keeps it.
let me = null;
try { me = JSON.parse(sessionStorage.getItem("uo-seat")); } catch (e) {}
const bubbles = [];       // {who, text, until}: what was said, over the speaker
const PLAYER_COLORS = ["#f0c419", "#e86a5c", "#5cc8e8", "#b58cf0", "#8ce87a"];
const worn = new Map();   // tile -> footfall: the town's paths, worn in by walking
const seen = {};          // name -> last activity, for the crier
const shutSeen = {};      // trade -> whether its shop was shut, for the crier

function premisesOf(title) {
  const s = map.shops.find(s => s.title === title);
  return s ? s.premises : "the " + title.toLowerCase();
}

function hhmm(s) {
  const d = Math.floor(s / 86400) + 1, h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60);
  return { day: d, text: String(h).padStart(2, "0") + ":" + String(m).padStart(2, "0"), hour: h + m / 60 };
}

// The map's width fills the stage; its height scrolls. The canvas's CSS
// size is set exactly, or the browser stretches it and every pixel blurs.
function fit() {
  if (!map) return;
  const w = document.getElementById("stage").clientWidth;
  tile = Math.max(3, Math.floor(w / map.width * 4) / 4);
  canvas.width = Math.round(map.width * tile * devicePixelRatio);
  canvas.height = Math.round(map.height * tile * devicePixelRatio);
  canvas.style.width = (map.width * tile) + "px";
  canvas.style.height = (map.height * tile) + "px";
  ground.width = canvas.width; ground.height = canvas.height;
  paintGround();
}

function groundTile(x, y) {   // map-relative tile
  const T = tile * devicePixelRatio, g = grass(x, y), w = worn.get((x + map.x) + "," + (y + map.y)) || 0;
  const v = Math.min(1, w / 12);
  gctx.fillStyle = `rgb(${Math.round(58 + g * 14 + v * 70)},${Math.round(92 + g * 18 + v * 20)},${Math.round(44 + g * 8 + v * 30)})`;
  gctx.fillRect(x * T, y * T, T + 1, T + 1);
}

// Each shop a roof with its trade on it, small, inside its own walls
// where it fits; the full name is on the card when someone stands by it.
function paintShops() {
  const d = devicePixelRatio, T = tile * d;
  gctx.textAlign = "center"; gctx.textBaseline = "middle";
  for (const s of map.shops) {
    const x = (s.x1 - map.x) * T, y = (s.y1 - map.y) * T, w = (s.x2 - s.x1 + 1) * T, h = (s.y2 - s.y1 + 1) * T;
    gctx.fillStyle = "#a0563b"; gctx.fillRect(x, y, w, h);
    gctx.strokeStyle = "#4a2618"; gctx.lineWidth = d * 2; gctx.strokeRect(x, y, w, h);
    gctx.fillStyle = "#f6e7c8";
    for (const px of [11, 9]) {   // the trade's name where it fits, else none
      gctx.font = `${px * d}px Georgia`;
      if (gctx.measureText(s.title).width <= w - 4 * d && px * d <= h) { gctx.fillText(s.title, x + w / 2, y + h / 2); break; }
    }
  }
  gctx.textBaseline = "alphabetic";
}

function paintGround() {
  for (let y = 0; y < map.height; y++) for (let x = 0; x < map.width; x++) groundTile(x, y);
  paintShops();
}

function grass(x, y) {   // a cheap hash, so the grass is the same every frame
  const n = Math.sin(x * 12.9898 + y * 78.233) * 43758.5453;
  return n - Math.floor(n);
}

function crier(text) {
  const li = document.createElement("li");
  li.innerHTML = `<span class="t">Day ${hhmm(seconds).day} ${hhmm(seconds).text}</span>`;
  li.append(text);
  const list = document.getElementById("crier");
  list.prepend(li);
  while (list.children.length > 60) list.lastChild.remove();
}

function take(snapshot) {
  const now = performance.now();
  prev = {};
  for (const p of people) prev[p.name] = { x: p.drawX ?? p.x, y: p.drawY ?? p.y };
  for (const p of players) prev["seat " + p.seat] = { x: p.drawX ?? p.x, y: p.drawY ?? p.y };
  players = snapshot.players || [];
  for (const line of snapshot.said || []) {
    bubbles.push({ who: line.who, text: line.text, until: now + 6000 });
    crier(`${line.who} to ${line.to}: “${line.text}”`);
  }
  seconds = snapshot.seconds;
  people = snapshot.people;
  lastAt = now;
  for (const p of people) {
    const k = p.x + "," + p.y, was = worn.get(k) || 0;
    if (was < 40) {
      worn.set(k, was + 1);
      if (map && was < 12) { groundTile(p.x - map.x, p.y - map.y); wornSince = true; }
    }
    const [job] = JOBS[p.job] || JOBS[0];
    if (seen[p.name] !== undefined && seen[p.name] !== p.activity) crier(`${p.name} the ${job} ${DOING[p.activity] || "wanders"}.`);
    seen[p.name] = p.activity;
  }
  keepers = snapshot.keepers || [];
  const opened = [], closed = [];
  for (const k of keepers) {
    const shut = k.shut !== 0;
    if (shutSeen[k.title] !== undefined && shutSeen[k.title] !== shut) (shut ? closed : opened).push(premisesOf(k.title));
    shutSeen[k.title] = shut;
  }
  // The morning's openings come together: one line for a crowd of them.
  if (opened.length > 3) crier(`${opened.length} of Britain's shops open for trade.`);
  else for (const o of opened) crier(`${o} opens for trade.`);
  if (closed.length > 3) crier(`${closed.length} of Britain's shops shut their doors.`);
  else for (const c of closed) crier(`${c} shuts its doors.`);
  for (const b of document.querySelectorAll("#speed button")) b.classList.toggle("on", Number(b.dataset.x) === snapshot.speed);
  // A path worn over a shop's label: the labels go back on top.
  if (wornSince) { paintShops(); wornSince = false; }
  const t = hhmm(seconds);
  document.getElementById("time").textContent = `Day ${t.day}, ${t.text}`;
  showCard();
}

function showCard() {
  const card = document.getElementById("card");
  const k = keepers.find(q => "keeper " + q.title === following);
  if (k) {
    card.classList.remove("hint");
    card.textContent = `${TRADES[k.title] || "🧑"} The ${k.title.toLowerCase()} of ${premisesOf(k.title)}: ${k.shut ? "shut" : "open for trade"}.`;
    return;
  }
  const p = people.find(q => q.name === following);
  if (!p) return;
  if (p.hitY !== undefined) {   // keep the one followed in view
    const stage = document.getElementById("stage");
    if (p.hitY < stage.scrollTop + 40 || p.hitY > stage.scrollTop + stage.clientHeight - 40)
      stage.scrollTo({ top: p.hitY - stage.clientHeight / 2, behavior: "smooth" });
  }
  const [job, face] = JOBS[p.job] || JOBS[0];
  const shop = map.shops.find(s => p.x >= s.x1 - 3 && p.x <= s.x2 + 3 && p.y >= s.y1 - 3 && p.y <= s.y2 + 3);
  card.classList.remove("hint");
  card.textContent = `${face} ${p.name}, the ${job}: ${AT[p.activity] || "about"}, ` +
    (shop ? `by ${shop.premises}.` : `out in the town (${p.x}, ${p.y}).`);
}

function draw() {
  requestAnimationFrame(draw);
  if (!map) return;
  const d = devicePixelRatio, T = tile * d;
  const sx = x => (x - map.x) * T, sy = y => (y - map.y) * T;
  ctx.drawImage(ground, 0, 0);
  ctx.textAlign = "center";
  const hour = hhmm(seconds).hour, dark = hour < 5 || hour > 21 ? 0.55 : hour < 7 ? (7 - hour) * 0.27 : hour > 19 ? (hour - 19) * 0.27 : 0;
  const f = Math.min(1, (performance.now() - lastAt) / 250);
  // The players: each seat its colour, this browser's ringed in gold.
  for (const p of players) {
    const from = prev["seat " + p.seat] || p;
    p.drawX = from.x + (p.x - from.x) * f;
    p.drawY = from.y + (p.y - from.y) * f;
    const x = sx(p.drawX) + T / 2, y = sy(p.drawY) + T / 2, r = 12 * d, mine = me && me.seat === p.seat;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fillStyle = PLAYER_COLORS[p.seat % PLAYER_COLORS.length]; ctx.fill();
    ctx.strokeStyle = mine ? "#ffd700" : "#1d2318"; ctx.lineWidth = (mine ? 4 : 2) * d; ctx.stroke();
    ctx.font = `${13 * d}px serif`; ctx.textBaseline = "middle"; ctx.fillStyle = "#000";
    ctx.fillText("🧭", x, y + d);
    ctx.font = `${12 * d}px Georgia`; ctx.textBaseline = "alphabetic";
    const label = mine ? p.name + " (you)" : p.name, nw = ctx.measureText(label).width + 10 * d;
    ctx.fillStyle = "rgba(60,40,0,0.85)"; ctx.fillRect(x - nw / 2, y + r + 3 * d, nw, 16 * d);
    ctx.fillStyle = "#ffe9a0"; ctx.fillText(label, x, y + r + 15 * d);
    p.hitX = x / d; p.hitY = y / d;
  }
  // The keepers: smaller, behind their counters, faded while the shop is shut.
  for (const k of keepers) {
    if (k.x < 0) continue;
    const x = sx(k.x) + T / 2, y = sy(k.y) + T / 2, r = 9 * d;
    ctx.globalAlpha = k.shut ? 0.4 : 1;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fillStyle = "#e8dcc0"; ctx.fill();
    ctx.strokeStyle = "keeper " + k.title === following ? "#fff" : "#4a2618"; ctx.lineWidth = 2 * d; ctx.stroke();
    ctx.font = `${11 * d}px serif`; ctx.textBaseline = "middle"; ctx.fillStyle = "#000";
    ctx.fillText(TRADES[k.title] || "🧑", x, y + d);
    ctx.textBaseline = "alphabetic"; ctx.globalAlpha = 1;
    k.hitX = x / d; k.hitY = y / d;
  }
  people.forEach((p, i) => {
    const from = prev[p.name] || p;
    p.drawX = from.x + (p.x - from.x) * f;
    p.drawY = from.y + (p.y - from.y) * f;
    // People sharing a tile (the inn's beds) are fanned out so each shows.
    const twin = people.slice(0, i).filter(q => q.x === p.x && q.y === p.y).length;
    const x = sx(p.drawX) + T / 2 + twin * 18 * d, y = sy(p.drawY) + T / 2, r = 13 * d;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fillStyle = COLORS[i % COLORS.length]; ctx.fill();
    ctx.strokeStyle = p.name === following ? "#fff" : "#1d2318"; ctx.lineWidth = (p.name === following ? 3 : 2) * d; ctx.stroke();
    ctx.font = `${15 * d}px serif`; ctx.textBaseline = "middle"; ctx.fillStyle = "#000";
    ctx.fillText((JOBS[p.job] || JOBS[0])[1], x, y + d);
    ctx.font = `${12 * d}px Georgia`; ctx.textBaseline = "alphabetic";
    const nw = ctx.measureText(p.name).width + 10 * d;
    ctx.fillStyle = "rgba(20,24,16,0.8)"; ctx.fillRect(x - nw / 2, y - r - 19 * d, nw, 16 * d);
    ctx.fillStyle = "#fff"; ctx.fillText(p.name, x, y - r - 7 * d);
    p.hitX = x / d; p.hitY = y / d;
  });
  if (dark > 0) { ctx.fillStyle = `rgba(10,14,40,${dark})`; ctx.fillRect(0, 0, canvas.width, canvas.height); }
  // Speech bubbles over whoever spoke (a resident by name, a keeper by trade).
  const now = performance.now();
  while (bubbles.length && bubbles[0].until < now) bubbles.shift();
  for (const b of bubbles) {
    const who = people.find(p => p.name === b.who) || keepers.find(k => k.title === b.who);
    if (!who || who.hitX === undefined) continue;
    const text = b.text.length > 60 ? b.text.slice(0, 57) + "…" : b.text;
    ctx.font = `${12 * d}px Georgia`;
    const w = ctx.measureText(text).width + 14 * d, x = who.hitX * d, y = who.hitY * d - 34 * d;
    ctx.fillStyle = "rgba(255,250,235,0.95)"; ctx.fillRect(x - w / 2, y - 16 * d, w, 22 * d);
    ctx.strokeStyle = "#4a2618"; ctx.lineWidth = d; ctx.strokeRect(x - w / 2, y - 16 * d, w, 22 * d);
    ctx.fillStyle = "#2a1a08"; ctx.fillText(text, x, y);
  }
}

canvas.addEventListener("click", e => {
  const b = canvas.getBoundingClientRect();
  const x = e.clientX - b.left, y = e.clientY - b.top;
  let best = null, dist = 28;
  for (const p of people) { const dd = Math.hypot(p.hitX - x, p.hitY - y); if (dd < dist) { dist = dd; best = p.name; } }
  for (const k of keepers) { const dd = Math.hypot(k.hitX - x, k.hitY - y); if (dd < dist) { dist = dd; best = "keeper " + k.title; } }
  // Open ground: a player walks there; anyone else's tap follows no one.
  if (!best && me) {
    const tx = Math.floor(x / tile) + map.x, ty = Math.floor(y / tile) + map.y;
    fetch(`go?t=${me.token}&x=${tx}&y=${ty}`, { method: "POST" }).then(r => { if (r.status === 403) forget(); });
    return;
  }
  following = best;
  if (!best) { const c = document.getElementById("card"); c.classList.add("hint"); c.textContent = "Tap a townsperson to follow them."; }
  showCard();
});

function showYou() {
  const you = document.getElementById("you");
  if (!me) return;
  you.innerHTML = "";
  you.append(`You are ${me.name}. Tap open ground to walk there; walk into a shop and its keeper greets you.`);
}

// A seat the server no longer holds for us (idle, or a restart): join again.
function forget() {
  me = null;
  try { sessionStorage.removeItem("uo-seat"); } catch (e) {}
  location.reload();
}

document.getElementById("join").addEventListener("submit", async e => {
  e.preventDefault();
  const name = document.getElementById("name").value.trim();
  const r = await fetch("join?name=" + encodeURIComponent(name), { method: "POST" });
  if (!r.ok) { crier(r.status === 503 ? "The town is full: five players at most." : "A name is 1 to 16 letters."); return; }
  const seat = await r.json();
  me = { token: seat.token, seat: seat.seat, name };
  try { sessionStorage.setItem("uo-seat", JSON.stringify(me)); } catch (e) {}
  showYou();
  crier(`${name} comes to Britain.`);
});
showYou();

for (const b of document.querySelectorAll("#speed button"))
  b.addEventListener("click", () => fetch("speed?x=" + b.dataset.x, { method: "POST" }));

function listen() {
  const live = document.getElementById("live");
  const es = new EventSource("events");
  es.onmessage = e => { live.classList.remove("off"); take(JSON.parse(e.data)); };
  es.onerror = () => live.classList.add("off");
}

(async () => {
  map = await (await fetch("map")).json();
  fit();
  window.addEventListener("resize", fit);
  take(await (await fetch("now")).json());
  crier("The town wakes. Watch the townsfolk go about their day.");
  listen();
  draw();
  // Open on the townsfolk: the inn is mid-map, below the first screenful.
  requestAnimationFrame(() => {
    const ys = people.map(p => p.hitY).filter(y => y !== undefined), stage = document.getElementById("stage");
    if (ys.length) stage.scrollTop = ys.reduce((a, b) => a + b) / ys.length - stage.clientHeight / 2;
  });
})();
</script>
</body>
</html>
